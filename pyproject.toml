[project]
name = "epistole"
version = "0.0.7"
description = "Epistole is a single Python API for sending email, regardless of the backend."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ozan Ozbeker", email = "github@ozanozbeker.com" }]
keywords = ["email", "gmail", "microsoft-graph", "smtp"]
# The Python classifiers and the test matrix in `ci.yml` list the same versions (CONTRIBUTING.md).
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Communications :: Email",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Changelog = "https://ozanozbeker.com/epistole/changelog.html"
Documentation = "https://ozanozbeker.com/epistole/"
Issues = "https://github.com/ozanozbeker/epistole/issues"
Repository = "https://github.com/ozanozbeker/epistole"

[project.optional-dependencies]
all = ["epistole[gmail,graph,markdown]"]
gmail = ["google-auth>=2.57", "httpx2>=2.12,<3"]
graph = ["httpx2>=2.12,<3", "msal>=1.38"]
markdown = ["markdown-it-py>=4.2"]

[dependency-groups]
dev = [
  "css-inline>=0.21.3",
  "epistole[gmail,graph,markdown]",
  "inscriptis>=2.7.4",
  "prek>=0.5.2",
  "pyrefly>=1.2.0",
  "pytest>=9.1.1",
  "ruff>=0.16.6",
  "rumdl>=0.2.68",
  "tombi>=1.5.2",
]
# Not in `dev`, so the test and lint jobs skip Quarto's Jupyter stack.
docs = ["great-docs>=0.17"]

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
# importlib mode imports epistole from the installed package, not from src/. tests/ needs no __init__.py.
addopts = ["--strict-config", "--strict-markers", "--import-mode=importlib", "-ra"]
# A new upstream deprecation fails the Dependabot PR that brings it in, before the removal breaks epistole.
filterwarnings = ["error"]
testpaths = ["tests"]
xfail_strict = true
