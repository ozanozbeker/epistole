# Each build generates `great-docs/_quarto.yml` from this file, so edit this file, not that one.

parser: numpy
dynamic: true

display_name: Epistole
site_url: https://ozanozbeker.com/epistole/

authors:
  - name: Ozan Ozbeker
    role: Maintainer
    email: github@ozanozbeker.com

logo: assets/epistole-hex.svg

# The favicon is an SVG, because great-docs copies an SVG unchanged, and its own PNG icons blur the mark.
favicon: assets/epistole-favicon.svg
# great-docs reads no pre-made icon sizes, so this links the exported Apple touch icon. The URL is absolute, because Quarto does not rewrite paths in header HTML.
include_in_header: '<link rel="apple-touch-icon" href="https://ozanozbeker.com/epistole/assets/epistole-favicon-180.png">'

# great-docs reads no `_brand.yml`, so `assets/theme.css` carries its palette until it does.
accent_color:
  light: "#9E4A2B"
  dark: "#D79A80"
site:
  css: assets/theme.css

# The image is a URL into `assets/`, because great-docs copies a local path to the build root, which Quarto does not publish.
social_cards:
  image: https://ozanozbeker.com/epistole/assets/epistole-social-card.png
  twitter_card: summary_large_image

# Without `base_url`, great-docs sets the canonical URL and `og:url` to the github.io address, which redirects to `site_url`.
seo:
  canonical:
    base_url: https://ozanozbeker.com/epistole/
  # great-docs 0.17.0 adds the site name a second time (posit-dev/great-docs#327). Delete this once a release includes #335.
  title_template: "{page_title}"

user_guide:
  - section: Guide
    contents:
      - sending.qmd
      - writing-html-for-email.qmd
      - choosing-a-backend.qmd
      - mail-services.qmd
      - upgrading.qmd

reference:
  desc: "`ADR-NNNN` in a docstring names a file in [`docs/adr/`](https://github.com/ozanozbeker/epistole/tree/main/docs/adr), the decision records in the repo."
  sections:
    - title: Backends
      desc: A backend holds the credential and the from address, and it sends or opens a connection.
      contents:
        - SMTPBackend
        - GmailBackend
        - GraphBackend
        - ConsoleBackend
        - MemoryBackend
    - title: Credentials
      desc: Each backend module exports its credentials.
      contents:
        - smtp.Password
        - smtp.OAuth
        - gmail.ServiceAccount
        - gmail.AuthorizedUser
        - graph.ClientSecret
        - graph.Certificate
        - graph.ManagedIdentity
    - title: Message
      desc: A message is an immutable value, and each builder method returns a copy.
      contents:
        - name: Message
          members:
            - to
            - cc
            - bcc
            - reply_to
            - subject
            - headers
            - attach
            - embed
    - title: Values
      desc: What a send takes and returns.
      contents:
        - Address
        - Attachment
        - Refusal
        - SendResult
        - Submission
    - title: Base classes and protocols
      desc: What a third-party backend implements.
      contents:
        - Backend
        - Connection
        - Transport
        - TokenCredential
        - AccessToken
    - title: Exceptions
      desc: Every error Epistole raises for a failed send subclasses `EpistoleError`.
      contents:
        - exceptions.EpistoleError
        - exceptions.RejectedError
        - exceptions.SenderRefusedError
        - exceptions.RecipientsRefusedError
        - exceptions.AuthenticationError
        - exceptions.ThrottledError
        - exceptions.TransportError
        - exceptions.ProviderError
    - title: Functions
      contents:
        - html_to_text
