name: Release Please

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Only jobs in this environment can read the App's private key, and `deployment: false` keeps each run from writing a deployment record.
    environment:
      name: release
      deployment: false
    steps:
      # Unlike `GITHUB_TOKEN`, an App token lets the release PR run CI and lets the release start `release.yml`.
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
      # Every setting is in `release-please-config.json`. A `release-type` input here makes the action ignore that file.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app.outputs.token }}
