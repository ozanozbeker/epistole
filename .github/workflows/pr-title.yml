name: PR title

# The squash commit takes the PR title, and release-please reads that commit.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions: {}

jobs:
  title:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          # uv follows setup-uv, which Dependabot bumps after the cooldown.
          version: latest-known
          enable-cache: false
      # The `commit-msg` hook from `prek.toml` checks the title, so titles and local commits follow one rule set.
      - run: |
          printf '%s\n' "$TITLE" > "$RUNNER_TEMP/title.txt"
          uv run --locked --only-dev prek run --stage commit-msg --commit-msg-filename "$RUNNER_TEMP/title.txt" conventional-pre-commit
        env:
          TITLE: ${{ github.event.pull_request.title }}
