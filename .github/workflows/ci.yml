name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # The same versions as the Python classifiers in `pyproject.toml`.
        python: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      # uv otherwise runs the macOS and Windows images' own 3.11.9, which predates the CVE-2023-27043 fix (ADR 0014).
      UV_PYTHON_PREFERENCE: only-managed
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ matrix.python }}
          # uv follows setup-uv, which Dependabot bumps after the cooldown.
          version: latest-known
          # Every dependency is a pre-built wheel, so a cache hit saves nothing.
          enable-cache: false
      # `--no-editable` installs the built wheel, so the tests import what PyPI would get.
      - run: uv sync --locked --no-editable
      - run: uv run --no-sync pytest

  # The newest CPython that has reached its first beta, in a job that may fail.
  # It stays on a version after its final release, until the next version reaches its first beta.
  next-python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.15"
          version: latest-known
          enable-cache: false
      - run: uv sync --locked --no-editable
      - run: uv run --no-sync pytest

  # Each runtime floor in `pyproject.toml` is the oldest version that passes, so this job tests the floors.
  lowest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # uv reads the floor Python from `.python-version`.
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: latest-known
          enable-cache: false
      # `lowest-direct` resolves each transitive dependency to its newest release, so `--exclude-newer` applies Dependabot's cooldown.
      - run: uv sync --resolution lowest-direct --no-editable --exclude-newer '7 days'
      # The suite runs once on Ubuntu here, so this job also checks coverage.
      - run: uv run --no-sync coverage run -m pytest
      - run: uv run --no-sync coverage report

  # Local hooks miss a `--no-verify` commit and a fork's commits, so CI runs the hooks on every file and `gitleaks-ci` on every new commit.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # `gitleaks-ci` reads every commit the pull request adds.
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: latest-known
          enable-cache: false
      - run: uv sync --locked
      - run: uv run --no-sync prek run --all-files --show-diff-on-failure
        env:
          # zizmor skips its online audits without a token.
          GH_TOKEN: ${{ github.token }}
          # Both read staged changes only, and CI stages nothing.
          SKIP: gitleaks,check-added-large-files
      # gitleaks exits 0 when `git log` fails on a shallow clone, so check that the parent exists first.
      - run: |
          git rev-parse --verify --quiet HEAD^1
          uv run --no-sync prek run --all-files --hook-stage manual gitleaks-ci

  # Epistole's examples send mail, so the build runs none of them and fails only when a page stops rendering.
  docs:
    runs-on: ubuntu-latest
    # Quarto sets no timeout on a cell.
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # great-docs reads the git history for page dates.
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: latest-known
          enable-cache: false
      - uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b # v2.2.0
        with:
          version: "1.10.18"
      - run: uv sync --locked --group docs
      - run: uv run --no-sync great-docs build
        env:
          # great-docs reads GitHub Releases for the changelog page, and an anonymous runner gets 60 requests an hour.
          GITHUB_TOKEN: ${{ github.token }}

  # The ruleset requires this one job, so a change to the jobs above never touches the ruleset.
  all-green:
    if: always()
    needs: [test, next-python, lowest, lint, docs]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: {}
    steps:
      - uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          allowed-failures: next-python
          jobs: ${{ toJSON(needs) }}
