default_language_version.python = "3.13"
default_install_hook_types = ["pre-commit", "commit-msg"]

# --- Conventional Commits ---
[[repos]]
repo = "https://github.com/compilerla/conventional-pre-commit"
rev = "91ab4bf57e58b32adf1a122681f6ebe164d081c8"  # frozen: v4.4.0
hooks = [
  {
    id = "conventional-pre-commit",
    stages = ["commit-msg"],
    args = [
      "--strict",
    ]
  }
]

# --- Gitleaks ---
[[repos]]
repo = "https://github.com/gitleaks/gitleaks"
rev = "83d9cd684c87d95d656c1458ef04895a7f1cbd8e"  # frozen: v8.30.1
hooks = [{ id = "gitleaks" }]

# --- Zizmor ---
[[repos]]
repo = "https://github.com/zizmorcore/zizmor-pre-commit"
rev = "451b56af716f9f0d0c2b816503a3fd0cf8b036fa"  # frozen: v1.29.0
hooks = [{ id = "zizmor" }]

# --- Pre-Commit ---
[[repos]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
rev = "3e8a8703264a2f4a69428a0aa4dcb512790b2c8c"  # frozen: v6.0.0
hooks = [
  { id = "trailing-whitespace" },
  { id = "end-of-file-fixer" },
  { id = "check-merge-conflict" },
  { id = "check-yaml" },
  { id = "check-case-conflict" },
  { id = "check-added-large-files" },
]

# --- Local Tools ---
[[repos]]
repo = "local"
hooks = [
  {
    id = "ruff-check",
    name = "ruff check",
    entry = "uv run ruff check --fix --force-exclude",
    language = "system",
    types_or = ["python", "pyi", "jupyter"],
    require_serial = true,
  },
  {
    id = "ruff-format",
    name = "ruff format",
    entry = "uv run ruff format --force-exclude",
    language = "system",
    types_or = ["python", "pyi", "jupyter", "markdown"],
    require_serial = true,
  },
  {
    id = "rumdl",
    name = "rumdl",
    entry = "uv run rumdl check --fix",
    language = "system",
    types = ["markdown"],
    require_serial = true,
  },
  {
    id = "tombi-lint",
    name = "tombi lint",
    entry = "uv run tombi lint",
    language = "system",
    types = ["toml"],
  },
  {
    id = "tombi-format",
    name = "tombi format",
    entry = "uv run tombi format",
    language = "system",
    types = ["toml"],
  },
  {
    id = "uv-lock",
    name = "uv lock --check",
    entry = "uv lock --check",
    language = "system",
    files = '^(.*/)?(pyproject\.toml|uv\.lock)$',
    pass_filenames = false,
  },
  {
    id = "pyrefly",
    name = "pyrefly",
    entry = "uv run pyrefly check",
    language = "system",
    types = ["python"],
    pass_filenames = false,
  },
  {
    id = "pytest",
    name = "pytest",
    entry = "uv run pytest",
    language = "system",
    stages = ["pre-commit"],
    always_run = true,
    pass_filenames = false,
  },
]
